name: Update Dashboard Data

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Todoist data
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: |
          set -e

          # Verify token is set
          if [ -z "$TODOIST_TOKEN" ]; then
            echo "::error::TODOIST_API_TOKEN secret is not set"
            exit 1
          fi
          echo "Token length: ${#TODOIST_TOKEN} chars"

          # Fetch tasks
          HTTP_CODE=$(curl -s -o /tmp/tasks.json -w "%{http_code}" \
            -H "Authorization: Bearer $TODOIST_TOKEN" \
            "https://api.todoist.com/api/v1/tasks")
          echo "Tasks API response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Todoist tasks API returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Fetch projects
          HTTP_CODE=$(curl -s -o /tmp/projects.json -w "%{http_code}" \
            -H "Authorization: Bearer $TODOIST_TOKEN" \
            "https://api.todoist.com/api/v1/projects")
          echo "Projects API response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Todoist projects API returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Debug: show response structure
          python3 -c "
          import json
          with open('/tmp/tasks.json') as f:
              d = json.load(f)
          print('Tasks type:', type(d).__name__)
          if isinstance(d, dict):
              print('Tasks keys:', list(d.keys()))
          elif isinstance(d, list):
              print('Tasks count:', len(d))
              if d: print('First task keys:', list(d[0].keys()))
          with open('/tmp/projects.json') as f:
              d = json.load(f)
          print('Projects type:', type(d).__name__)
          if isinstance(d, dict):
              print('Projects keys:', list(d.keys()))
          elif isinstance(d, list):
              print('Projects count:', len(d))
              if d: print('First project keys:', list(d[0].keys()))
          "

          # Transform into dashboard format
          python3 - <<'PYEOF'
          import json
          from datetime import datetime, timezone

          with open("/tmp/tasks.json") as f:
              raw_tasks = json.load(f)
          with open("/tmp/projects.json") as f:
              raw_projects = json.load(f)

          # Handle both array and wrapped responses
          api_tasks = raw_tasks if isinstance(raw_tasks, list) else raw_tasks.get("results", raw_tasks.get("items", []))
          api_projects = raw_projects if isinstance(raw_projects, list) else raw_projects.get("results", raw_projects.get("items", []))

          project_map = {p["id"]: p["name"] for p in api_projects}

          tasks = []
          for t in api_tasks:
              due_date = None
              recurring = None
              if t.get("due"):
                  due_date = t["due"].get("datetime") or t["due"].get("date")
                  if t["due"].get("is_recurring"):
                      recurring = t["due"].get("string")

              dur = None
              if t.get("duration"):
                  unit = t["duration"]["unit"]
                  amount = t["duration"]["amount"]
                  dur = f"{amount}m" if unit == "minute" else f"{amount}h"

              import re
              content = t["content"]
              content = re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', content)
              content = re.sub(r'^(Obsidian\s*:?\s*)', '', content, flags=re.IGNORECASE)

              tasks.append({
                  "id": t["id"],
                  "content": content,
                  "labels": t.get("labels", []),
                  "priority": f"p{t['priority']}",
                  "projectName": project_map.get(t["project_id"], "Unknown"),
                  "dueDate": due_date,
                  "duration": dur,
                  "recurring": recurring,
              })

          data = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "tasks": tasks,
          }

          with open("data.json", "w") as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"Wrote {len(tasks)} tasks")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dashboard data"
            git push
          fi
