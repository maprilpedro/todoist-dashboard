name: Update Dashboard Data

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Todoist data
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: |
          set -e

          # Fetch tasks and projects in parallel
          curl -sf -H "Authorization: Bearer $TODOIST_TOKEN" \
            "https://api.todoist.com/rest/v2/tasks" -o /tmp/tasks.json

          curl -sf -H "Authorization: Bearer $TODOIST_TOKEN" \
            "https://api.todoist.com/rest/v2/projects" -o /tmp/projects.json

          # Transform into dashboard format
          python3 - <<'PYEOF'
          import json
          from datetime import datetime, timezone

          with open("/tmp/tasks.json") as f:
              api_tasks = json.load(f)
          with open("/tmp/projects.json") as f:
              api_projects = json.load(f)

          project_map = {p["id"]: p["name"] for p in api_projects}

          tasks = []
          for t in api_tasks:
              due_date = None
              recurring = None
              if t.get("due"):
                  due_date = t["due"].get("datetime") or t["due"].get("date")
                  if t["due"].get("is_recurring"):
                      recurring = t["due"].get("string")

              dur = None
              if t.get("duration"):
                  unit = t["duration"]["unit"]
                  amount = t["duration"]["amount"]
                  dur = f"{amount}m" if unit == "minute" else f"{amount}h"

              import re
              content = t["content"]
              content = re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', content)
              content = re.sub(r'^(Obsidian\s*:?\s*)', '', content, flags=re.IGNORECASE)

              tasks.append({
                  "id": t["id"],
                  "content": content,
                  "labels": t.get("labels", []),
                  "priority": f"p{t['priority']}",
                  "projectName": project_map.get(t["project_id"], "Unknown"),
                  "dueDate": due_date,
                  "duration": dur,
                  "recurring": recurring,
              })

          data = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "tasks": tasks,
          }

          with open("data.json", "w") as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"Wrote {len(tasks)} tasks")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dashboard data"
            git push
          fi
