name: Update Dashboard Data

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and transform Todoist data
        env:
          TODOIST_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
        run: |
          set -e
          if [ -z "$TODOIST_TOKEN" ]; then
            echo "::error::TODOIST_API_TOKEN secret is not set"
            exit 1
          fi

          python3 - <<'PYEOF'
          import json, re, os, urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["TODOIST_TOKEN"]
          BASE = "https://api.todoist.com/api/v1"

          def fetch_all(endpoint):
              """Fetch all pages from a paginated Todoist API v1 endpoint."""
              results = []
              cursor = None
              while True:
                  url = f"{BASE}/{endpoint}"
                  if cursor:
                      url += f"?cursor={cursor}"
                  req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read())
                  results.extend(data.get("results", []))
                  cursor = data.get("next_cursor")
                  if not cursor:
                      break
              return results

          print("Fetching tasks...")
          api_tasks = fetch_all("tasks")
          print(f"  Got {len(api_tasks)} tasks")

          print("Fetching projects...")
          api_projects = fetch_all("projects")
          print(f"  Got {len(api_projects)} projects")

          project_map = {p["id"]: p["name"] for p in api_projects}

          tasks = []
          for t in api_tasks:
              due_date = None
              recurring = None
              if t.get("due"):
                  due_date = t["due"].get("datetime") or t["due"].get("date")
                  if t["due"].get("is_recurring"):
                      recurring = t["due"].get("string")

              dur = None
              if t.get("duration"):
                  unit = t["duration"]["unit"]
                  amount = t["duration"]["amount"]
                  dur = f"{amount}m" if unit == "minute" else f"{amount}h"

              content = t["content"]
              content = re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', content)
              content = re.sub(r'^(Obsidian\s*:?\s*)', '', content, flags=re.IGNORECASE)

              tasks.append({
                  "id": t["id"],
                  "content": content,
                  "labels": t.get("labels", []),
                  "priority": f"p{t['priority']}",
                  "projectName": project_map.get(t.get("project_id"), "Unknown"),
                  "dueDate": due_date,
                  "duration": dur,
                  "recurring": recurring,
              })

          data = {
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "tasks": tasks,
          }

          with open("data.json", "w") as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"Wrote {len(tasks)} tasks to data.json")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update dashboard data"
            git push
          fi
